name: Temporary Yandex ZIP handoff

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGNED_URL_B64: 
    steps:
      - name: Rehydrate exact Yandex ZIP
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNED_URL_B64" | base64 -d > signed-url.txt
          curl -fL "$(cat signed-url.txt)" -o yandex-game.zip.b64
          base64 -d yandex-game.zip.b64 > yandex-game.zip
          python3 - <<'PY'
          import zipfile, hashlib, os, sys
          p='yandex-game.zip'
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert 'index.html' in names, 'index.html is not at ZIP root'
              bad=[n for n in names if n.startswith(('project/','dist/','build/'))]
              assert not bad, f'outer wrapper folder found: {bad[:5]}'
              roots=sorted({n.split('/')[0] for n in names})
              print('ROOTS=' + ','.join(roots))
              print('FILES=' + str(len(names)))
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          print('SHA256=' + h)
          print('SIZE=' + str(os.path.getsize(p)))
          PY

      - name: Upload exact ZIP
        uses: actions/upload-artifact@v5
        with:
          name: yandex-game-direct
          path: yandex-game.zip
          if-no-files-found: error
          retention-days: 1
